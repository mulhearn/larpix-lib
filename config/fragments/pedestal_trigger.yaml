# Pedestals, step 1 (as larpix-control's pedestal_qc.py):  periodic trigger and reset, all CSAs on.
# Register 128 complete;  cycle counts as little-endian bytes:  trigger 100000, reset 4096.
external: []

default:
  enable_cross_trigger:            0
  enable_periodic_reset:           1
  enable_rolling_periodic_reset:   0
  enable_periodic_trigger:         1
  enable_rolling_periodic_trigger: 1
  enable_periodic_trigger_veto:    1
  enable_hit_veto:                 0
  "periodic_trigger_cycles[0]":    0xA0
  "periodic_trigger_cycles[1]":    0x86
  "periodic_trigger_cycles[2]":    0x01
  "periodic_trigger_cycles[3]":    0x00
  "periodic_reset_cycles[0]":      0x00
  "periodic_reset_cycles[1]":      0x10
  "periodic_reset_cycles[2]":      0x00
  csa_enable:                      1
